<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POSH Training Centre</title>
<style>
  :root {
    --navy: #111111;
    --navy-2: #f6c98a;
    --ink: #111111;
    --cream: #ffffff;
    --card: #ffffff;
    --gold: #111111;
    --gold-2: #111111;
    --rose: #111111;
    --green: #111111;
    --muted: #111111;
    --line: #f6c98a;
    --rose-bg: #ffffff;
    --green-bg: #f6c98a;
    --wash: #f6c98a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Calibri, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
  }
  button, input { font-family: inherit; }
  h1, h2, h3 { font-family: Georgia, "Palatino Linotype", serif; font-weight: normal; color: var(--navy); }
  .app { display: flex; min-height: 100vh; align-items: stretch; }
  .side {
    width: 280px;
    flex: 0 0 280px;
    background: #000;
    color: #fff;
    padding: 28px 16px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #topicNav {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    margin-top: 4px;
  }
  .brand {
    font-family: Georgia, serif;
    font-size: 22px;
    line-height: 1.2;
    margin: 0 8px 6px;
    color: #fff;
  }
  .brand span { display: block; color: #fff; font-size: 12px; font-family: Calibri, "Segoe UI", sans-serif; letter-spacing: 0.06em; margin-bottom: 8px; line-height: 1.35; }
  .progress-label { margin: 16px 8px 8px; color: #fff; font-size: 13px; }
  .bar { height: 6px; background: #fff; border-radius: 99px; margin: 0 8px 16px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--wash); width: 0; }
  .nav-btn, .side a.nav-btn {
    display: flex;
    gap: 10px;
    align-items: center;
    width: 100%;
    text-align: left;
    background: transparent;
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 9px 10px;
    margin: 1px 0;
    cursor: pointer;
    text-decoration: none;
    font-size: 14.5px;
    line-height: 1.35;
  }
  .nav-btn:hover, .nav-btn.on { background: var(--wash); color: #111; box-shadow: none; }
  .nav-btn:hover .n, .nav-btn.on .n { background: #111; color: #fff; }
  .nav-btn:hover small, .nav-btn.on small { color: #111; }
  .nav-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .nav-btn .n {
    flex: 0 0 28px;
    height: 28px;
    border-radius: 6px;
    background: #111;
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
  }
  .nav-btn.done .n { background: #111; color: #fff; border: 1px solid #fff; }
  .nav-btn small { display: block; color: #fff; font-size: 11px; }
  .main-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .logged-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
    padding: 14px 28px;
    background: #fff;
    border-bottom: 1px solid var(--wash);
    color: #111;
  }
  .logged-bar[hidden] { display: none; }
  .logged-bar .pill {
    background: var(--wash);
    color: var(--navy);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 8px;
  }
  .logged-bar strong { font-size: 16px; }
  .logged-bar #logoutBtn { padding: 8px 12px; }
  main {
    flex: 1 1 auto;
    min-width: 0;
    padding: 40px 48px 72px;
  }
  .page { width: 100%; max-width: 1180px; }
  .kicker { color: var(--gold); font-weight: 700; letter-spacing: 0.12em; font-size: 12px; margin: 0 0 8px; }
  h1 { font-size: 40px; margin: 0 0 14px; line-height: 1.15; }
  h2 { font-size: 28px; margin: 32px 0 12px; }
  .lead { font-size: 19px; line-height: 1.65; max-width: none; }
  .page p, .page .read, .page .discuss { text-align: justify; hyphens: auto; }
  .page .kicker, .page .score, .page .anchor, .page .num { text-align: left; }
  .block {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 32px 34px 34px;
    margin: 0 0 28px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
  }
  .block h2 { margin: 0 0 18px; font-size: 30px; }
  .discuss {
    font-size: 18px;
    line-height: 1.65;
    margin: 0 0 26px;
    max-width: none;
  }
  .intro h2 { margin: 28px 0 10px; font-size: 24px; }
  .intro p { margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 0; }
  .home-cards { margin: 22px 0 8px; }
  .q-card h2 { margin: 0 0 12px; font-size: 24px; }
  .topics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin: 8px 0 28px; }
  .topic-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 18px 18px 16px;
    min-height: 118px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
  }
  .topic-card:hover { border-color: var(--navy); }
  .topic-card .num { color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
  .topic-card h3 { margin: 8px 0 0; font-size: 18px; line-height: 1.3; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    padding: 22px 22px 20px 26px;
    position: relative;
  }
  .block > .grid .card, .home-cards .card { background: var(--card); }
  .card:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--gold); }
  .card h3 { margin: 0 0 10px; font-size: 20px; }
  .card p, .prose p, .law p { margin: 0; line-height: 1.6; font-size: 17px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 0; }
  .col { padding: 0; }
  .col.bad { background: #fff; }
  .col.good { background: var(--wash); }
  .col h3 { margin: 0; font-size: 18px; color: #fff; padding: 16px 18px; line-height: 1.35; }
  .col.bad h3 { background: #111; }
  .col.good h3 { background: #111; color: #fff; }
  .col ul { margin: 0; padding: 18px 20px 8px 36px; }
  .col li { margin: 0 0 14px; line-height: 1.55; font-size: 17px; }
  .case { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 22px; margin: 0; align-items: start; }
  .facts { background: #fff; color: #111; border: 1px solid #111; padding: 26px 26px 22px; }
  .facts h3 { color: var(--navy); margin: 0 0 12px; font-size: 13px; letter-spacing: 0.08em; }
  .facts p { line-height: 1.6; margin: 0 0 16px; font-size: 17px; }
  .anchor { color: var(--navy); font-size: 15px; line-height: 1.5; margin: 0; }
  .read { background: #fff; border: 1px solid #111; padding: 16px 18px; margin: 0 0 12px; line-height: 1.55; font-size: 17px; }
  .closebox { background: #fff; border: 1px solid #111; padding: 18px 18px 16px; }
  .closebox strong { display: block; color: var(--gold); letter-spacing: 0.06em; font-size: 12px; margin-bottom: 8px; }
  .closebox p { margin: 0; line-height: 1.55; font-size: 17px; }
  .ask-block { background: #fff; border-color: var(--line); }
  .ask-block .kicker { color: var(--navy); }
  .ask-block h2, .ask-block p { color: var(--ink); }
  .ask-block p { font-size: 18px; line-height: 1.55; margin: 0 0 18px; max-width: none; }
  .rule { display: none; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .btn {
    background: var(--wash);
    color: #111;
    border: 1px solid #111;
    padding: 12px 16px;
    font-size: 15px;
    cursor: pointer;
  }
  .btn.gold { background: #111; color: #fff; font-weight: 700; border-color: #111; }
  .btn.ghost { background: #fff; color: #111; border: 1px solid #111; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .q-card { background: var(--card); border: 1px solid var(--line); padding: 18px; margin-bottom: 16px; }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: white;
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-top: 8px;
    cursor: pointer;
    font-size: 15.5px;
  }
  .opt.on { border-color: #111; background: var(--wash); }
  .opt.right { border-color: #1b7f3a; background: #e5f6ec; color: #146b32; font-weight: 700; }
  .opt.wrong { border-color: #c0392b; background: #fdecea; color: #c0392b; }
  .opt.locked { cursor: default; }
  .mark { margin: 10px 0 0; font-size: 15px; line-height: 1.4; }
  .mark.ok { color: #146b32; font-weight: 700; }
  .mark.no { color: #c0392b; font-weight: 700; }
  .mark .answer { color: #146b32; font-weight: 700; }
  .score, .fail, .pass { font-family: Georgia, serif; font-size: 56px; margin: 0; color: #111; }
  .why { background: #fff; border-left: 4px solid var(--wash); padding: 10px 12px; margin: 8px 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input[type="text"] {
    width: 100%;
    max-width: 520px;
    border: 1px solid var(--line);
    background: white;
    padding: 10px 12px;
    font-size: 16px;
  }
  .note { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .warn { background: var(--wash); border-left: 4px solid #111; padding: 12px 14px; margin: 0 0 16px; }
  .cert-sheet {
    max-width: 980px;
    margin: 8px auto 32px;
    padding: 46px 54px 40px;
    background: #fff;
    color: #111;
    text-align: center;
    border: 10px solid #111;
    box-shadow: inset 0 0 0 1px #111, inset 0 0 0 8px #fff, inset 0 0 0 9px #111;
  }
  .page .cert-sheet h1,
  .page .cert-sheet p {
    text-align: center;
    color: #111;
    margin-left: 0;
    margin-right: 0;
    hyphens: manual;
  }
  .cert-kicker { letter-spacing: 0.32em; padding-left: 0.32em; font-size: 13px; font-weight: 700; margin: 6px 0 0; }
  .cert-rule { width: 160px; height: 1px; background: #111; margin: 14px auto; border: 0; }
  .cert-title { font-family: Georgia, "Palatino Linotype", serif; font-size: 46px; line-height: 1; margin: 4px 0 0; letter-spacing: 0.03em; padding-left: 0.03em; color: #111; }
  .cert-lead { margin-top: 26px; font-size: 15px; letter-spacing: 0.12em; padding-left: 0.12em; text-transform: uppercase; }
  .cert-name {
    display: inline-block;
    min-width: 320px;
    margin-top: 8px;
    padding: 0 28px 8px;
    border-bottom: 1px solid #111;
    font-family: Georgia, "Palatino Linotype", serif;
    font-style: italic;
    font-size: 40px;
    line-height: 1.15;
    color: #111;
  }
  .cert-org { margin-top: 16px; font-size: 22px; letter-spacing: 0.04em; padding-left: 0.04em; }
  .cert-state { width: 100%; max-width: none; margin: 22px 0 0; font-size: 16px; line-height: 1.45; text-align: center; }
  .cert-label { margin-top: 22px; font-size: 12px; letter-spacing: 0.14em; padding-left: 0.14em; text-transform: uppercase; }
  .cert-label strong { display: block; margin-top: 6px; font-size: 16px; letter-spacing: 0.04em; padding-left: 0.04em; text-transform: none; font-weight: 700; }
  .cert-foot { margin-top: 28px; font-size: 12px; letter-spacing: 0.16em; padding-left: 0.16em; text-transform: uppercase; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; max-width: 860px; }
  .field label { margin: 0 0 6px; }
  .field input { max-width: none; }
  .field.wide { grid-column: 1 / -1; }
  .fields .actions { grid-column: 1 / -1; margin-top: 4px; }
  .person { font-size: 18px; line-height: 1.55; margin: 0; }
  .law-page .lead { margin-bottom: 12px; }
  .law {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px 40px;
    margin-top: 22px;
  }
  .law h3 { margin: 0 0 8px; font-size: 22px; }
  .law p { margin: 0; max-width: none; }
  #sheet { display: none; }
  @media (max-width: 1100px) {
    .topics { grid-template-columns: 1fr 1fr; }
    main { padding: 32px 28px 56px; }
  }
  @media (max-width: 900px) {
    .app { display: block; }
    .side { width: auto; height: auto; position: relative; overflow: visible; display: block; }
    #topicNav { overflow: visible; }
    .logged-bar { flex-wrap: wrap; justify-content: flex-start; padding: 12px 16px; }
    main { padding: 24px 16px 48px; }
    .grid, .split, .case, .topics, .fields, .law { grid-template-columns: 1fr; }
  }
  @media print {
    body * { visibility: hidden; }
    #sheet, #sheet * { visibility: visible; }
    #sheet {
      display: block !important;
      position: absolute;
      inset: 0;
      background: white;
    }
    .app { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <p class="brand"><span>PREVENTION OF SEXUAL HARASSMENT</span>POSH Training Centre</p>
    <a class="nav-btn" href="index.html"><span class="n">H</span><span>Home<small>Landing page</small></span></a>
    <div class="progress-label" id="progressLabel">0 of 15 topics passed</div>
    <div class="bar"><i id="progressBar"></i></div>
    <div id="topicNav"></div>
  </aside>
  <div class="main-col">
    <div class="logged-bar" id="loggedBar" hidden>
      <span class="pill">Logged in</span>
      <strong id="loggedName"></strong>
      <span id="loggedOrg"></span>
      <button class="btn ghost" id="logoutBtn" type="button" hidden>Log out</button>
    </div>
    <main id="main"></main>
  </div>
</div>
<div id="sheet"></div>
<script src="course-data.js"></script>
<script>
const DB_KEY = "posh-db-v1";
if (typeof COURSE === "undefined" || !COURSE.topics) {
  document.getElementById("main").innerHTML = '<div class="page"><h1>The course did not open.</h1><p class="lead">Keep this file in the same folder as course-data.js, then open POSH-Training-Course.html in Edge or Chrome.</p></div>';
} else {

let db;
let view;
let quiz = null;

function loadDb() {
  try {
    const raw = JSON.parse(localStorage.getItem(DB_KEY));
    if (raw && Array.isArray(raw.people) && raw.attempts) return raw;
  } catch (e) {}
  return { people: [], sessionId: null, attempts: {} };
}
function saveDb() {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  syncServer();
}
function syncServer() {
  try {
    const person = sessionPerson();
    if (!person || typeof fetch !== "function") return;
    const a = attempt();
    const passed = COURSE.topics.filter((t) => a.cleared && a.cleared[t.n]).length;
    const cert = a.cert && a.cert.downloaded ? { id: a.cert.id, iso: a.cert.iso, downloaded: true } : null;
    fetch("https://www.acertax.com/posh/api.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "sync",
        person: {
          id: person.id,
          name: person.name,
          employeeId: person.employeeId,
          designation: person.designation,
          division: person.division,
          org: person.org,
          registeredAt: person.at,
          topic: a.finished ? COURSE.topics.length : (a.at || 1),
          passed: passed,
          total: COURSE.topics.length,
          finished: !!a.finished,
          certificate: cert
        }
      })
    }).catch(function () {});
  } catch (err) {}
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function sessionPerson() {
  if (!db.sessionId) return null;
  return db.people.find((p) => p.id === db.sessionId) || null;
}
function attempt() {
  if (!db.sessionId) return { at: 1, cleared: {}, cert: null, finished: false };
  if (!db.attempts[db.sessionId]) db.attempts[db.sessionId] = { at: 1, cleared: {}, cert: null, finished: false };
  const a = db.attempts[db.sessionId];
  if (!a.cleared) a.cleared = {};
  if (!a.at) a.at = 1;
  return a;
}
function enforceRetake() {
  const person = sessionPerson();
  if (!person) return;
  const a = attempt();
  if (a.finished && !(a.cert && a.cert.downloaded)) {
    if (sessionStorage.getItem("posh-cert-live") !== person.id) {
      a.at = 1;
      a.cleared = {};
      a.finished = false;
      a.cert = null;
      saveDb();
    }
  }
}
function openingView() {
  if (location.hash === "#register" || !sessionPerson()) return { name: "register" };
  const a = attempt();
  if (a.finished) return { name: "cert" };
  return { name: "topic", n: a.at || 1 };
}
function clearedCount() {
  const cleared = attempt().cleared || {};
  return COURSE.topics.filter((t) => cleared[t.n]).length;
}
function currentTopic() {
  if (!sessionPerson()) return null;
  const a = attempt();
  if (a.finished) return null;
  return a.at || 1;
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function pickQuestions(topic) {
  return topic.questions.slice(0, 4).map((q, i) => ({
    id: topic.n + "-" + i,
    q: q.q,
    why: q.why,
    choice: null,
    options: shuffle(q.options.map((text, idx) => ({ text: text, correct: idx === q.a })))
  }));
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function go(next) {
  if (next.name === "topic") {
    if (!sessionPerson() || next.n !== currentTopic()) return;
  }
  view = next;
  quiz = null;
  render();
  window.scrollTo(0, 0);
}

function renderNav() {
  const done = sessionPerson() ? clearedCount() : 0;
  document.getElementById("progressLabel").textContent = done + " of 15 topics passed";
  document.getElementById("progressBar").style.width = (done / 15 * 100) + "%";
  const open = currentTopic();
  document.getElementById("topicNav").innerHTML = COURSE.topics.map((t) => {
    const cleared = sessionPerson() && attempt().cleared && attempt().cleared[t.n];
    const locked = t.n !== open;
    const cls = "nav-btn" + (cleared ? " done" : "") + (view.name === "topic" && view.n === t.n ? " on" : "");
    const sub = cleared ? "<small>Passed</small>" : "";
    return '<button class="' + cls + '" type="button" data-topic="' + t.n + '"' + (locked ? " disabled" : "") + '><span class="n">' + String(t.n).padStart(2, "0") + "</span><span>" + esc(t.short) + sub + "</span></button>";
  }).join("");
}

function renderSession() {
  const bar = document.getElementById("loggedBar");
  const person = sessionPerson();
  if (!person) {
    bar.hidden = true;
    return;
  }
  bar.hidden = false;
  document.getElementById("loggedName").textContent = person.name;
  document.getElementById("loggedOrg").textContent = person.org;
  document.getElementById("logoutBtn").hidden = false;
}

function shell(html) {
  renderNav();
  renderSession();
  document.getElementById("main").innerHTML = '<div class="page">' + html + "</div>";
  bind();
}

function bind() {
  document.querySelectorAll("[data-topic]").forEach((btn) => {
    btn.onclick = () => {
      if (btn.disabled) return;
      const n = Number(btn.getAttribute("data-topic"));
      if (n === currentTopic()) go({ name: "topic", n: n });
    };
  });
  const empForm = document.getElementById("empForm");
  if (empForm) empForm.onsubmit = saveEmployee;
  const start = document.getElementById("startTest");
  if (start) start.onclick = () => startQuiz(Number(start.getAttribute("data-n")));
  const next = document.getElementById("nextTopic");
  if (next) next.onclick = () => advance(Number(next.getAttribute("data-n")));
  document.querySelectorAll(".opt").forEach((btn) => {
    btn.onclick = () => choose(Number(btn.getAttribute("data-q")), Number(btn.getAttribute("data-o")));
  });
  const submit = document.getElementById("submitTest");
  if (submit) submit.onclick = submitQuiz;
  const download = document.getElementById("downloadCert");
  if (download) download.onclick = downloadCertificate;
  const logout = document.getElementById("logoutBtn");
  if (logout) logout.onclick = logOut;
  const logoutPage = document.getElementById("logoutPage");
  if (logoutPage) logoutPage.onclick = logOut;
}

function registerHtml() {
  return '<section class="block"><p class="kicker">REGISTER</p><h1>Who is taking the POSH training and test</h1>'
    + '<p class="lead">Enter your details to begin. Each registration is kept as a new record and starts a fresh attempt. The topics then open in order, from 1 to 15.</p>'
    + employeeForm("Register") + "</section>";
}

function field(id, name, label) {
  return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" name="' + name + '" type="text" required value=""></div>';
}

function employeeForm(submitLabel) {
  return '<form id="empForm" class="fields">'
    + field("nm", "name", "Full name")
    + field("eid", "employeeId", "Employee ID")
    + field("ds", "designation", "Designation")
    + field("dv", "division", "Division")
    + '<div class="field wide"><label for="og">Organisation</label><input id="og" name="org" type="text" required value=""></div>'
    + '<div class="actions"><button class="btn gold" type="submit">' + esc(submitLabel) + "</button></div></form>";
}

function saveEmployee(ev) {
  ev.preventDefault();
  const data = new FormData(ev.target);
  const person = {
    id: newId(),
    name: String(data.get("name") || "").trim(),
    employeeId: String(data.get("employeeId") || "").trim(),
    designation: String(data.get("designation") || "").trim(),
    division: String(data.get("division") || "").trim(),
    org: String(data.get("org") || "").trim(),
    at: new Date().toISOString()
  };
  if (!person.name || !person.employeeId || !person.designation || !person.division || !person.org) return;
  db.people.push(person);
  db.sessionId = person.id;
  db.attempts[person.id] = { at: 1, cleared: {}, cert: null, finished: false };
  sessionStorage.removeItem("posh-cert-live");
  saveDb();
  go({ name: "topic", n: 1 });
}

function topicHtml(n) {
  const t = COURSE.topics.find((x) => x.n === n);
  const cleared = attempt().cleared && attempt().cleared[n];
  const cards = t.cards.map((c) => '<div class="card"><h3>' + esc(c.h) + "</h3><p>" + esc(c.p) + "</p></div>").join("");
  const left = t.left.map((x) => "<li>" + esc(x) + "</li>").join("");
  const right = t.right.map((x) => "<li>" + esc(x) + "</li>").join("");
  const reads = t.caseRead.map((x) => '<div class="read">' + esc(x) + "</div>").join("");
  const status = "There are four questions. Score the topic whatever the answers are. The correct answers are shown on the score screen. Take the test again until all four are correct. Only then do the next topic's questions open.";
  const actions = '<button class="btn gold" id="startTest" type="button" data-n="' + n + '">' + (cleared ? "Take the test again" : "Answer the questions") + "</button>";
  return '<section class="block">'
    + '<p class="kicker">TOPIC ' + String(n).padStart(2, "0") + " OF 15</p>"
    + "<h1>" + esc(t.title) + "</h1>"
    + '<p class="kicker">WHAT THIS TOPIC IS ABOUT</p>'
    + '<p class="lead">' + esc(t.objective) + "</p>"
    + "</section>"
    + '<section class="block">'
    + '<p class="kicker">THE CONCEPT</p>'
    + '<p class="discuss">' + esc(t.discuss) + "</p>"
    + '<div class="grid">' + cards + "</div>"
    + "</section>"
    + '<section class="block">'
    + '<p class="kicker">EXAMPLES</p>'
    + '<div class="split"><div class="col bad"><h3>' + esc(t.leftTitle) + "</h3><ul>" + left + '</ul></div><div class="col good"><h3>' + esc(t.rightTitle) + "</h3><ul>" + right + "</ul></div></div>"
    + "</section>"
    + '<section class="block">'
    + '<p class="kicker">CASE STUDY</p>'
    + "<h2>" + esc(t.caseTitle) + "</h2>"
    + '<div class="case"><div class="facts"><h3>WHAT HAPPENED</h3><p>' + esc(t.caseFacts) + '</p><p class="anchor">' + esc(t.lawAnchor) + '</p></div><div>' + reads + '<div class="closebox"><strong>ILLUSTRATIVE READING</strong><p>' + esc(t.caseClose) + "</p></div></div></div>"
    + "</section>"
    + '<section class="block ask-block">'
    + '<p class="kicker">QUESTIONS</p>'
    + "<p>" + esc(status) + "</p>"
    + '<div class="actions">' + actions + "</div></section>";
}

function nextButton(n) {
  const on = !!(attempt().cleared && attempt().cleared[n]);
  return '<button class="btn gold" id="nextTopic" type="button" data-n="' + n + '"' + (on ? "" : " disabled") + ">Next topic</button>";
}

function advance(n) {
  const a = attempt();
  if (!(a.cleared && a.cleared[n]) || n >= 15 || n !== a.at) return;
  a.at = n + 1;
  saveDb();
  go({ name: "topic", n: a.at });
}

function startQuiz(n) {
  if (!sessionPerson() || n !== currentTopic()) return;
  const t = COURSE.topics.find((x) => x.n === n);
  quiz = { n: n, items: pickQuestions(t) };
  view = { name: "quiz", n: n };
  render();
  window.scrollTo(0, 0);
}

function choose(qi, oi) {
  if (quiz.items[qi].choice !== null) return;
  quiz.items[qi].choice = oi;
  render();
}

function quizHtml() {
  const t = COURSE.topics.find((x) => x.n === quiz.n);
  const total = quiz.items.length;
  const blocks = quiz.items.map((item, qi) => {
    const locked = item.choice !== null;
    const opts = item.options.map((o, oi) => {
      let cls = "opt";
      if (locked && o.correct) cls += " right";
      else if (locked && item.choice === oi) cls += " wrong";
      if (locked) cls += " locked";
      return '<button class="' + cls + '" type="button" data-q="' + qi + '" data-o="' + oi + '">' + esc(o.text) + "</button>";
    }).join("");
    let mark = "";
    if (locked) {
      const picked = item.options[item.choice];
      if (picked.correct) mark = '<p class="mark ok">Right.</p><p class="mark">' + esc(item.why) + "</p>";
      else {
        const correct = item.options.find((o) => o.correct);
        mark = '<p class="mark no">Wrong. The right answer is: <span class="answer">' + esc(correct.text) + "</span></p><p class=\"mark\">" + esc(item.why) + "</p>";
      }
    }
    return '<div class="q-card"><p class="kicker">QUESTION ' + (qi + 1) + " OF " + total + "</p><h2>" + esc(item.q) + "</h2>" + opts + mark + "</div>";
  }).join("");
  return '<p class="kicker">TOPIC ' + String(t.n).padStart(2, "0") + "  ·  QUESTIONS</p>"
    + "<h1>" + esc(t.short) + "</h1>"
    + "<p class=\"lead\">Select one choice on each question. Score this topic whatever the answers are. The correct answers stay on the score screen.</p>"
    + blocks
    + '<div class="actions"><button class="btn gold" id="submitTest" type="button">Score this topic</button></div>';
}

function submitQuiz() {
  const items = quiz.items;
  const total = items.length;
  const n = quiz.n;
  let score = 0;
  items.forEach((item) => {
    if (item.choice !== null && item.options[item.choice].correct) score += 1;
  });
  const perfect = score === total && total === 4;
  const a = attempt();
  const debrief = items.map((item) => {
    const correct = item.options.find((o) => o.correct);
    const ok = item.choice !== null && item.options[item.choice].correct;
    return { q: item.q, correct: correct.text, why: item.why, ok: ok };
  });
  if (perfect) {
    a.cleared[n] = true;
    if (n === 15) {
      a.finished = true;
      sessionStorage.setItem("posh-cert-live", db.sessionId);
      saveDb();
      quiz = null;
      view = { name: "cert" };
      render();
      window.scrollTo(0, 0);
      return;
    }
    a.at = n + 1;
    saveDb();
    quiz = null;
    startQuiz(n + 1);
    return;
  }
  delete a.cleared[n];
  saveDb();
  view = { name: "result", n: n, score: score, total: total, perfect: false, debrief: debrief };
  quiz = null;
  render();
  window.scrollTo(0, 0);
}

function resultHtml() {
  const t = COURSE.topics.find((x) => x.n === view.n);
  const rows = view.debrief.map((d) => '<div class="why"><strong>' + esc(d.q) + '</strong><p class="mark ' + (d.ok ? "ok" : "no") + '">' + (d.ok ? "Right." : "Wrong.") + ' Correct answer: <span class="answer">' + esc(d.correct) + "</span></p><p>" + esc(d.why) + "</p></div>").join("");
  return '<p class="kicker">TOPIC ' + String(t.n).padStart(2, "0") + "  ·  SCORE</p>"
    + '<p class="score fail">' + view.score + " / " + view.total + "</p>"
    + "<h1>Take the test again.</h1>"
    + '<p class="lead">You scored ' + view.score + " out of " + view.total + ". The correct answers are shown below. The next topic's questions open only when all four answers are correct.</p>"
    + rows
    + '<div class="actions"><button class="btn gold" id="startTest" type="button" data-n="' + t.n + '">Take the test again</button></div>';
}

function draftCert() {
  const person = sessionPerson();
  const today = new Date();
  const iso = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
  const stored = attempt().cert;
  const useIso = stored && stored.iso ? stored.iso : iso;
  return {
    name: person.name,
    org: person.org,
    iso: useIso,
    id: (stored && stored.id) ? stored.id : certId(useIso)
  };
}

function certHtml() {
  const person = sessionPerson();
  if (!person || !attempt().finished) {
    return '<section class="block"><p class="kicker">CERTIFICATE</p><h1>The certificate is not ready yet.</h1><p class="lead">It is prepared when every question on all 15 topics has been answered correctly.</p></section>';
  }
  const c = draftCert();
  const stored = attempt().cert && attempt().cert.downloaded;
  let actions = '<button class="btn gold" id="downloadCert" type="button">Download the certificate (PDF)</button>';
  if (stored) actions += '<button class="btn ghost" id="logoutPage" type="button">Log out</button>';
  return '<section class="block"><p class="kicker">CERTIFICATE</p><h1>Your certificate is ready.</h1>'
    + '<p class="warn">If you do not download the certificate, it will not be stored and you will have to retake the test.</p>'
    + '<p class="person"><strong>' + esc(c.name) + "</strong><br>" + esc(c.org) + "</p>"
    + '<div class="actions">' + actions + "</div></section>"
    + certificateMarkup(c);
}

function downloadCertificate() {
  const person = sessionPerson();
  if (!person || !attempt().finished) return;
  const c = draftCert();
  const blob = new Blob([buildPdf(c)], { type: "application/pdf" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "POSH-Certificate.pdf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  attempt().cert = { name: c.name, org: c.org, iso: c.iso, id: c.id, downloaded: true };
  db.nextSerial = (db.nextSerial || 1) + 1;
  saveDb();
  render();
}

function logOut() {
  if (!sessionPerson()) return;
  db.sessionId = null;
  sessionStorage.removeItem("posh-cert-live");
  saveDb();
  view = { name: "register" };
  quiz = null;
  render();
  window.scrollTo(0, 0);
}

function serialSuffix(n) {
  const width = Math.max(3, String(n).length);
  return "A" + String(n).padStart(width, "0");
}

function certId(iso) {
  return "POSH-" + iso.replace(/-/g, "") + "-" + serialSuffix(db.nextSerial || 1);
}

function niceDate(iso) {
  const p = iso.split("-");
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function certificateMarkup(c) {
  return '<div class="cert-sheet">'
    + '<p class="cert-kicker">Certificate of completion</p>'
    + '<hr class="cert-rule">'
    + '<h1 class="cert-title">POSH Training</h1>'
    + '<hr class="cert-rule">'
    + '<p class="cert-lead">This is to certify that</p>'
    + '<p class="cert-name">' + esc(c.name) + "</p>"
    + '<p class="cert-org">' + esc(c.org) + "</p>"
    + '<p class="cert-state">has successfully completed the course on Prevention of Sexual Harassment (POSH) at the Workplace.</p>'
    + '<p class="cert-label">Date of completion<strong>' + esc(niceDate(c.iso)) + "</strong></p>"
    + '<p class="cert-label">Certificate number<strong>' + esc(c.id) + "</strong></p>"
    + '<p class="cert-foot">Prevention of sexual harassment at the workplace</p>'
    + "</div>";
}

function pdfEscape(s) {
  return String(s).replace(/[^\x20-\x7E]/g, (ch) => {
    const map = { "\u2019": "'", "\u2018": "'", "\u201c": '"', "\u201d": '"', "\u2013": "-", "\u2014": "-", "\u00a0": " " };
    return map[ch] || "?";
  }).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
}

function buildPdf(c) {
  const pageW = 842;
  const line = "has successfully completed the course on Prevention of Sexual Harassment (POSH) at the Workplace.";
  const foot = "Prevention of sexual harassment at the workplace";
  const nameSize = Math.max(18, Math.min(32, 620 / Math.max(c.name.length, 1) * 1.8));
  const orgSize = Math.max(12, Math.min(16, 640 / Math.max(c.org.length, 1) * 1.5));
  const dateText = niceDate(c.iso);
  const timesWx = {
    F1: [250,333,408,500,500,833,778,333,333,333,500,564,250,333,250,278,500,500,500,500,500,500,500,500,500,500,278,278,564,564,564,444,921,722,667,667,722,611,556,722,722,333,389,722,611,889,722,722,556,722,667,556,611,722,722,944,722,722,611,333,278,333,469,500,333,444,500,444,500,444,333,500,500,278,278,500,278,778,500,500,500,500,333,389,278,500,500,722,500,500,444,480,200,480,541],
    F2: [250,333,555,500,500,1000,833,333,333,333,500,570,250,333,250,278,500,500,500,500,500,500,500,500,500,500,333,333,570,570,570,500,930,722,667,722,722,667,611,778,778,389,500,778,667,944,722,778,611,778,722,556,667,722,722,1000,722,722,667,333,278,333,581,500,333,500,556,444,556,444,333,500,556,278,333,556,278,833,556,500,556,556,444,389,333,556,500,722,500,500,444,394,220,394,520],
    F3: [250,333,420,500,500,833,778,333,333,333,500,675,250,333,250,278,500,500,500,500,500,500,500,500,500,500,333,333,675,675,675,500,920,611,611,667,722,611,611,722,722,333,444,667,556,833,667,722,611,722,611,500,556,722,611,833,611,556,556,389,278,389,422,500,333,500,500,444,500,444,278,500,500,278,278,444,278,722,500,500,500,500,389,389,278,500,444,667,444,444,389,400,275,400,541]
  };
  function width(font, text, size, track) {
    const table = timesWx[font] || timesWx.F1;
    const gap = track || 0;
    let w = 0;
    for (let i = 0; i < text.length; i++) {
      const code = text.charCodeAt(i);
      const wx = code >= 32 && code <= 126 ? table[code - 32] : 500;
      w += (wx / 1000) * size;
      if (i < text.length - 1) w += gap;
    }
    return w;
  }
  function draw(font, size, y, text, track) {
    const tc = track || 0;
    const x = (pageW - width(font, text, size, tc)) / 2;
    return "BT /" + font + " " + size.toFixed(1) + " Tf " + tc.toFixed(2) + " Tc 0 0 0 rg 1 0 0 1 " + x.toFixed(1) + " " + y.toFixed(1) + " Tm (" + pdfEscape(text) + ") Tj ET";
  }
  function rule(x1, x2, y) {
    return "0.8 w 0 0 0 RG " + x1 + " " + y + " m " + x2 + " " + y + " l S";
  }
  const nameW = Math.max(240, width("F3", c.name, nameSize, 0) + 36);
  const stream = [
    "1 1 1 rg 0 0 842 595 re f",
    "5 w 0 0 0 RG 22 22 798 551 re S",
    "0.7 w 34 34 774 527 re S",
    "1.3 w 46 46 750 503 re S",
    "0 0 0 rg 54 533 8 8 re f 54 54 8 8 re f 780 533 8 8 re f 780 54 8 8 re f",
    draw("F2", 11, 492, "CERTIFICATE OF COMPLETION", 1.8),
    rule(310, 532, 474),
    draw("F2", 34, 426, "POSH Training", 0.4),
    rule(310, 532, 408),
    draw("F1", 12, 372, "THIS IS TO CERTIFY THAT", 1.1),
    draw("F3", nameSize, 324, c.name, 0),
    "0.8 w 0 0 0 RG " + ((pageW - nameW) / 2).toFixed(1) + " 308 m " + ((pageW + nameW) / 2).toFixed(1) + " 308 l S",
    draw("F2", orgSize, 274, c.org, 0.3),
    draw("F1", 13, 228, line, 0),
    rule(160, 682, 186),
    draw("F2", 9, 158, "DATE OF COMPLETION", 1.2),
    draw("F2", 13, 138, dateText, 0),
    draw("F2", 9, 108, "CERTIFICATE NUMBER", 1.2),
    draw("F1", 13, 88, c.id, 0.4),
    draw("F1", 9, 62, foot.toUpperCase(), 1.1)
  ].join("\n");
  const data = stream + "\n";
  const objects = [
    "1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n",
    "2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n",
    "3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R /F3 7 0 R >> >> >> endobj\n",
    "4 0 obj << /Length " + data.length + " >> stream\n" + data + "endstream\nendobj\n",
    "5 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Times-Roman >> endobj\n",
    "6 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Times-Bold >> endobj\n",
    "7 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Times-Italic >> endobj\n"
  ];
  let body = "%PDF-1.4\n";
  const offsets = [0];
  objects.forEach((obj) => {
    offsets.push(body.length);
    body += obj;
  });
  const xrefAt = body.length;
  let xref = "xref\n0 8\n0000000000 65535 f \n";
  for (let i = 1; i <= 7; i++) xref += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  body += xref + "trailer << /Size 8 /Root 1 0 R >>\nstartxref\n" + xrefAt + "\n%%EOF";
  return body;
}

db = loadDb();
enforceRetake();
syncServer();
view = openingView();

function render() {
  if (!sessionPerson() && view.name !== "register") view = { name: "register" };
  if (view.name === "register") shell(registerHtml());
  else if (view.name === "topic") shell(topicHtml(view.n));
  else if (view.name === "quiz") shell(quizHtml());
  else if (view.name === "result") shell(resultHtml());
  else if (view.name === "cert") shell(certHtml());
  else shell(registerHtml());
}

render();
}
</script>
